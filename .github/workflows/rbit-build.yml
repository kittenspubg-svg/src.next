name: Orbit Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - kiwi
      - feature/terminal-theme-ntp
    tags:
      - "v*"

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CHROMIUM_OUT_DIR: out/Default
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install base build deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-pip \
            pkg-config \
            ca-certificates \
            unzip \
            zip \
            curl \
            ninja-build \
            libgtk-3-0 \
            libx11-dev \
            libxrandr-dev \
            libxss-dev \
            libasound2-dev \
            libnss3-dev \
            libxtst-dev \
            libdrm-dev

      - name: Install depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot_tools
          echo "/tmp/depot_tools" >> "$GITHUB_PATH"

      - name: Setup Android SDK
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Check repo build setup
        shell: bash
        run: |
          echo "PWD=$PWD"
          ls -la
          echo "--- repo root ---"
          find . -maxdepth 2 \( -name "BUILD.gn" -o -name "build" -o -name ".gn" \) | head -n 50 || true

      - name: Install Chromium build deps
        shell: bash
        if: hashFiles('build/install-build-deps.sh') != ''
        run: |
          export PATH="/tmp/depot_tools:$PATH"
          ./build/install-build-deps.sh --android

      - name: Generate GN args
        shell: bash
        run: |
          export PATH="/tmp/depot_tools:$PATH"

          mkdir -p "$CHROMIUM_OUT_DIR"

          if [ -f "build/config/BUILDCONFIG.gn" ]; then
            echo "Detected Chromium-style build config"
          fi

          if command -v gn >/dev/null 2>&1; then
            echo "gn exists"
          else
            echo "gn not found in PATH; this repo may need specific build tool bootstrap"
          fi

          # Recommended base config for Android APK builds.
          # Adjust target_cpu and additional args if this repo uses a different target.
          gn gen "$CHROMIUM_OUT_DIR" \
            --args='is_debug=false target_os="android" target_cpu="arm64" use_official_google_api_keys=false enable_nacl=false'

      - name: Build APK target
        shell: bash
        run: |
          export PATH="/tmp/depot_tools:$PATH"
          ninja -C "$CHROMIUM_OUT_DIR" chrome_public_apk

      - name: Locate APK artifacts
        shell: bash
        run: |
          find "$CHROMIUM_OUT_DIR" -type f \( -name "*.apk" -o -name "*.aab" \) | head -n 100 || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-artifacts
          path: |
            out/Default/**/*.apk
            out/Default/**/*.aab
          if-no-files-found: warn

      - name: Final status
        shell: bash
        run: |
          echo "Orbit Android build workflow finished."
          echo "Note: when this repo is synced to a full Chromium checkout, the GN/Ninja targets may need adjustment for the exact branch and dependencies used."
